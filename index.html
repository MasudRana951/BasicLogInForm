<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In Page</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <form action="#">
            <div class="form-title">
                <div class="title">login</div>
            </div>
            <div class="input-items">
                <input type="text" class="input-style" placeholder="Enter Your Name" required>
                <input type="password" class="input-style" placeholder="Enter Your Password">
            </div>
            <div class="submit-button">
                <input type="submit" value="Login">
            </div>
        </form>
        <div class="options">
            <p class="option-text"> or connnect with social media</p>
            <div class="twitter">
                <a href="#">
                    <i class='bx bxl-twitter' ></i>
                    <span>sign in with <span>twitter</span></span>
                </a>
            </div>
            <div class="facebook">
                <a href="#">
                    <i class='bx bxl-facebook' ></i>
                <span>sign in with <span>facebook</span></span>
                </a>

            </div>
        </div>
    </div>
</body>
</html>
